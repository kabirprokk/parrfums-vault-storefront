name: Commerce checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Start preview server
        run: |
          PORT=8000 node scripts/serve.cjs > /tmp/parrfums-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/admin | grep -q 'id="app"'; then exit 0; fi
            sleep 1
          done
          cat /tmp/parrfums-http.log
          exit 1
      - run: PV_TEST_URL=http://127.0.0.1:8000 npm run test:browser
      - run: npm run test:audit
      - run: npm audit --audit-level=moderate
